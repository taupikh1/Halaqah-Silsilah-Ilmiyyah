name: Sinkron Materi Ilmiyyah
on:
  schedule:
    # Menit ke-01 setiap jam, termasuk 00:01 WIB.
    - cron: '1 * * * *'
  workflow_dispatch:

concurrency:
  group: halaqah-pages
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
      pages: read
    outputs:
      publish: ${{ steps.snapshot.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'lxml==6.0.2'
      - name: Cek artikel di sumber
        run: python scripts/sync.py --root .
      - id: snapshot
        name: Simpan arsip yang lolos pemeriksaan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          git add index.html updates.json Katalog.csv images
          if ! git diff --cached --quiet; then
            git -c user.name=github-actions[bot] -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -m 'Sinkron materi Ilmiyyah'
            git push
          fi
          live_url=$(gh api "repos/$REPOSITORY/pages" --jq '.html_url' 2>/dev/null || true)
          live_revision=''
          if [ -n "$live_url" ] && [ "$EVENT" = schedule ]; then
            live_revision=$(curl -fsSL --max-time 20 "${live_url%/}/updates.json?run=$GITHUB_RUN_ID" | jq -r '.revision' || true)
          fi
          if [ "$EVENT" = schedule ] && [ "$live_revision" = "$(jq -r '.revision' updates.json)" ]; then
            echo 'publish=false' >> "$GITHUB_OUTPUT"
          else
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Siapkan berkas publik
        if: steps.snapshot.outputs.publish == 'true'
        run: |
          mkdir _site
          cp index.html sw.js updates.json Katalog.csv _site/
          touch _site/.nojekyll
          for path in images audio BACA-DULU.txt Audio-belum-tersedia.csv; do
            if [ -e "$path" ]; then cp -R "$path" _site/; fi
          done
          du -sh _site
      - uses: actions/upload-pages-artifact@v3
        if: steps.snapshot.outputs.publish == 'true'
        with:
          path: _site

  deploy:
    needs: sync
    if: needs.sync.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy ke GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
